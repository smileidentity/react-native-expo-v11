version: 2
updates:
  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directory: /sample-expo
    schedule:
      interval: weekly
    # @expo/metro-config 54.0.6 depends on "postcss": "~8.4.32", which caps
    # postcss below 8.5.0, while the lowest fix for its four open advisories
    # (GHSA-qx2v-qp2m-jg93, GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849,
    # GHSA-fxqj-rqcc-2cmp) is 8.5.10. No lockfile-only update can satisfy
    # them, so there is no version Dependabot could open a PR for. Drop this
    # entry once @expo/metro-config widens the range; until then the alerts
    # stay visible in the Security tab.
    ignore:
      - dependency-name: postcss
  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directory: /sample-react-native
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    open-pull-requests-limit: 5
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
